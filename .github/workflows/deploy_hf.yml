name: 🚀 Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-to-hf:
    name: 🤗 Push Code to HF Space
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install huggingface_hub
        run: pip install huggingface_hub -q

      - name: 🤗 Upload code files to HF Space via API
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          repo_id = "mmossad824/sports-bot"

          # Only upload text/code files — skip binary files already on HF
          EXTENSIONS = {
              ".py", ".yml", ".yaml", ".json", ".txt", ".md",
              ".html", ".css", ".js", ".toml", ".cfg", ".ini",
              ".gitignore", ".gitattributes"
          }

          SKIP_DIRS = {".git", "__pycache__", ".github", "node_modules", ".venv"}
          SKIP_FILES = {"matches.db", "social_bot_state.json"}

          uploaded = 0
          failed = 0

          for root, dirs, files in os.walk("."):
              # Prune skip dirs in-place
              dirs[:] = [d for d in dirs if d not in SKIP_DIRS]

              for fname in files:
                  # Skip binary files
                  ext = os.path.splitext(fname)[1].lower()
                  if ext not in EXTENSIONS and fname not in {".gitignore", ".gitattributes", "Dockerfile"}:
                      print(f"  ⏭️  Skipping binary: {fname}")
                      continue
                  if fname in SKIP_FILES:
                      continue

                  local_path = os.path.join(root, fname)
                  # Convert ./path/to/file -> path/to/file for HF
                  hf_path = local_path.lstrip("./").lstrip("/")

                  try:
                      api.upload_file(
                          path_or_fileobj=local_path,
                          path_in_repo=hf_path,
                          repo_id=repo_id,
                          repo_type="space",
                          commit_message=f"Auto-deploy: update {hf_path}"
                      )
                      print(f"  ✅ Uploaded: {hf_path}")
                      uploaded += 1
                  except Exception as e:
                      print(f"  ❌ Failed: {hf_path} — {e}")
                      failed += 1

          print(f"\n🎉 Done! Uploaded: {uploaded} | Failed: {failed}")
          if failed > 0:
              exit(1)
          PYEOF


