<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f1420">
    <title>يلا شوت - الأخبار | Yalla Shoot News</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=4.0">
    <style>
        .article-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: var(--bg-card);
            border-radius: 12px;
            margin-top: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .article-header {
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }
        .article-title {
            font-family: 'Cairo', sans-serif;
            font-size: 2rem;
            color: white;
            line-height: 1.4;
            margin-bottom: 10px;
        }
        .article-meta {
            color: #8da3c7;
            font-size: 0.9rem;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .article-img {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .article-body {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #e2e8f0;
        }
        .article-body p {
            margin-bottom: 20px;
        }
        
        /* Ad Banners inside article */
        .article-ad-banner {
            width: 100%;
            background: #1a2235;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            margin: 25px 0;
            border: 1px dashed rgba(255,255,255,0.2);
            color: #8da3c7;
            font-size: 0.9rem;
        }
        
        /* Blur effect for locked content */
        .content-locked {
            filter: blur(5px);
            user-select: none;
            pointer-events: none;
        }

        /* 3-Clicks Modal Styles (reused from index.html) */
        #ad-click-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 20, 32, 0.95); z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(10px);
        }
        #ad-click-modal.hidden { display: none; }
        .adm-inner {
            background: var(--bg-card); padding: 40px; border-radius: 20px;
            text-align: center; max-width: 400px; width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .adm-icon { font-size: 4rem; color: var(--accent); margin-bottom: 20px; }
        .adm-title { font-size: 1.8rem; font-weight: 700; margin-bottom: 10px; font-family: 'Cairo', sans-serif;}
        .adm-sub { color: #8da3c7; margin-bottom: 25px; font-size: 1rem; }
        .adm-counter {
            font-size: 4rem; font-weight: 900; color: var(--accent);
            text-shadow: 0 0 20px rgba(0,210,138,0.4); margin-bottom: 20px;
            line-height: 1;
        }
        .adm-dots { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; }
        .adm-dot {
            width: 12px; height: 12px; border-radius: 50%;
            background: rgba(255,255,255,0.1); transition: all 0.3s;
        }
        .adm-dot.active { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
        .adm-btn {
            background: var(--accent); color: #000; font-size: 1.2rem; font-weight: 700;
            padding: 15px 30px; border-radius: 30px; border: none; cursor: pointer;
            width: 100%; transition: all 0.3s;
        }
        .adm-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,210,138,0.4); }
    </style>
</head>
<body>

<!-- ══ CLICK-TRAP AD MODAL ══ -->
<div id="ad-click-modal" class="hidden">
    <div class="adm-inner">
        <i class="fa-solid fa-newspaper adm-icon"></i>
        <div class="adm-title">اضغط لقراءة المقال</div>
        <div class="adm-sub">اضغط الزر <strong id="ad-clicks-needed">3</strong> مرات لفتح المقال مجاناً</div>
        <div class="adm-counter" id="ad-counter-display">3</div>
        <div class="adm-dots">
            <span class="adm-dot" id="ad-dot-1"></span>
            <span class="adm-dot" id="ad-dot-2"></span>
            <span class="adm-dot" id="ad-dot-3"></span>
        </div>
        <button class="adm-btn" id="ad-click-btn">
            <i class="fa-solid fa-book-open"></i> اقرأ الآن
        </button>
    </div>
</div>

<!-- ══ HEADER ══ -->
<header class="site-header" id="site-header">
    <div class="hdr-inner">
        <a class="hdr-logo" href="/">
            <i class="fa-solid fa-circle-play"></i>
            <span>يلا <span class="hdr-logo-accent">شوت</span></span>
        </a>
        <div class="hdr-actions">
            <a href="/news.html" class="hdr-icon-btn news-link-btn" style="text-decoration:none; display:flex; align-items:center; gap:5px; font-family: 'Cairo', sans-serif;">
                <i class="fa-regular fa-newspaper"></i> <span>الأخبار</span>
            </a>
            <button class="hdr-icon-btn lang-toggle-btn" id="lang-toggle-btn" aria-label="Switch Language" title="Switch Language / تغيير اللغة">English</button>
        </div>
    </div>
</header>

<main class="site-main" style="padding-top: 70px; min-height: 80vh;">
    <div class="article-container">
        <div id="article-content">
            <div style="text-align: center; padding: 40px; color: #8da3c7;">
                <i class="fa-solid fa-spinner fa-spin fa-3x"></i>
            </div>
        </div>
    </div>
</main>

<footer class="site-footer">
    <div class="ft-social">
        <a href="https://web.facebook.com/profile.php?id=61592307475993" class="ft-btn ft-fb"><i class="fa-brands fa-facebook-f"></i> فيسبوك</a>
        <a href="https://t.me/yalla_shoot_today_Group" class="ft-btn ft-tg"><i class="fa-brands fa-telegram"></i> قناة التليجرام</a>
    </div>
    <p class="ft-copy">© 2026 يلا شوت — الموقع الأول للأخبار الرياضية والمباريات</p>
</footer>

<script>
const SPONSOR_URL = "https://www.profitablecpmrate.com/e4480b4a0a4ef0a7e842009f7c505039";

document.addEventListener("DOMContentLoaded", async () => {
    const urlParams = new URLSearchParams(window.location.search);
    const articleId = urlParams.get('id');
    const container = document.getElementById("article-content");
    const modal = document.getElementById("ad-click-modal");
    
    if (!articleId) {
        container.innerHTML = "<div style='text-align:center; padding: 40px;'>لم يتم العثور على المقال.</div>";
        return;
    }

    try {
        const res = await fetch(`https://mmossad824-sports-bot.hf.space/api/news/${articleId}`);
        if (!res.ok) throw new Error("Article not found");
        const article = await res.json();
        
        let dateStr = "";
        if (article.pub_date) {
            dateStr = new Date(article.pub_date).toLocaleDateString('ar-EG', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        const imgHtml = article.image_url ? `<img src="${article.image_url}" alt="${article.title}" class="article-img">` : '';
        
        // Split content into paragraphs to inject ads
        const paragraphs = article.content.split('\n\n').filter(p => p.trim() !== '');
        let formattedContent = "";
        
        paragraphs.forEach((p, index) => {
            formattedContent += `<p>${p}</p>`;
            // Inject an ad banner every 3 paragraphs
            if ((index + 1) % 3 === 0 && index !== paragraphs.length - 1) {
                formattedContent += `
                <div class="article-ad-banner">
                    <a href="${SPONSOR_URL}" target="_blank" style="color:var(--accent); text-decoration:none; font-weight:bold;">
                        إعلان ممول - اضغط هنا لاكتشاف المزيد
                    </a>
                </div>`;
            }
        });

        container.innerHTML = `
            <div class="article-header">
                <h1 class="article-title">${article.title}</h1>
                <div class="article-meta">
                    <span><i class="fa-solid fa-rss"></i> ${article.source}</span>
                    <span><i class="fa-regular fa-clock"></i> ${dateStr}</span>
                </div>
            </div>
            ${imgHtml}
            <div class="article-body content-locked" id="body-text">
                ${formattedContent}
            </div>
        `;

        // Setup the 3-click modal
        setupAdModal();

    } catch (err) {
        console.error("Error loading article:", err);
        container.innerHTML = "<div style='text-align:center; padding: 40px;'>حدث خطأ في تحميل المقال. قد يكون محذوفاً.</div>";
    }
});

function setupAdModal() {
    const modal = document.getElementById('ad-click-modal');
    const btn = document.getElementById('ad-click-btn');
    const counterDisplay = document.getElementById('ad-counter-display');
    const clicksNeededSpan = document.getElementById('ad-clicks-needed');
    const bodyText = document.getElementById('body-text');
    
    // Check if user already unlocked today (optional: could remove this to force clicks every time)
    // For articles, we'll just force the click every time to maximize revenue, as requested.
    
    modal.classList.remove('hidden');
    
    let requiredClicks = 3;
    let currentClicks = 0;
    
    function updateDots() {
        for(let i=1; i<=3; i++) {
            const dot = document.getElementById('ad-dot-'+i);
            if (i <= currentClicks) dot.classList.add('active');
            else dot.classList.remove('active');
        }
    }
    
    btn.addEventListener('click', (e) => {
        e.preventDefault();
        
        // Open sponsor URL in new tab on every click
        window.open(SPONSOR_URL, '_blank');
        
        currentClicks++;
        let remaining = requiredClicks - currentClicks;
        
        if (remaining > 0) {
            counterDisplay.textContent = remaining;
            clicksNeededSpan.textContent = remaining;
            updateDots();
        } else {
            // Unlocked
            modal.classList.add('hidden');
            bodyText.classList.remove('content-locked');
            updateDots();
        }
    });
}
</script>
</body>
</html>
